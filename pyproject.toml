[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miwifi-mcp"
version = "0.1.0"
description = "小米 / 红米路由器 MCP Server —— 让 AI 助手直接管理路由器"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "xiaomi", "redmi", "router", "miwifi", "luci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "python-xiaomi-miwifi>=0.6.0",
  "mcp>=1.0.0",
  "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/2670321532/miwifi-mcp"
Repository = "https://github.com/2670321532/miwifi-mcp"
Issues = "https://github.com/2670321532/miwifi-mcp/issues"

# 这是 MCP server，不是可导入的库；不让 setuptools 猜包
[tool.setuptools]
py-modules = []

# ── Ruff（lint + format）────────────────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
]
ignore = [
  "E501",   # 行长度由 formatter 处理
  "B008",   # 允许函数调用作为默认参数
  "SIM108", # 不强制三元表达式
  "UP031",  # 允许 % 格式化：在"模板 + 小元组"场景比嵌套 f-string 更清晰
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
