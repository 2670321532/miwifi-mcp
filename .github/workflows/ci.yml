name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff lint
        run: ruff check server.py

      - name: Ruff format check
        run: ruff format --check server.py
        continue-on-error: true

      - name: Syntax check
        run: python -m py_compile server.py

  smoke:
    name: Smoke Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import + tool registry smoke test
        env:
          MIWIFI_PASSWORD: dummy-for-test
          MIWIFI_HOST: 192.168.31.1
        run: python tests/smoke_test.py

  mcp-handshake:
    name: MCP Protocol Handshake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start server + initialize + tools/list
        env:
          MIWIFI_PASSWORD: dummy-for-test
        run: python tests/mcp_handshake_test.py
